name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inyectar secrets y cifrar la página
        env:
          GYM_API: ${{ secrets.GYM_API_URL }}
          GYM_TOKEN: ${{ secrets.GYM_API_TOKEN }}
          GYM_PASSWORD: ${{ secrets.GYM_PASSWORD }}
        run: |
          mkdir build
          cp index.html build/
          [ -n "$GYM_API" ] && sed -i "s|__GYM_API__|$GYM_API|" build/index.html
          [ -n "$GYM_TOKEN" ] && sed -i "s|__GYM_TOKEN__|$GYM_TOKEN|" build/index.html
          if [ -z "$GYM_PASSWORD" ]; then echo "Falta el secret GYM_PASSWORD"; exit 1; fi
          npx --yes staticrypt build/index.html -p "$GYM_PASSWORD" -d _site --short --remember 30 \
            --template-title "Gym Tracker" --template-instructions "Introduce tu contraseña" --template-button "Entrar"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
